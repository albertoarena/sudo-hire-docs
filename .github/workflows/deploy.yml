name: Deploy

# Tests the site, builds it with the measurement ID and deploys it to Cloudflare Workers.
#
# It runs only when started by hand (Actions, Deploy, Run workflow), so a merge to main
# does not go live.
#
# wrangler.jsonc says which folder goes live: ./dist.
#
# The workflow needs two repository secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID,
# and the repository variable PUBLIC_GA_MEASUREMENT_ID.

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Both builds, Vitest, then Playwright with axe. The tests expect dist/
      # without an ID, so the build with the ID comes after them.
      - name: Build and run every test
        run: npm run check

      - name: Build the site with the measurement ID
        run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.1'
          command: deploy

      # The pages the app opens answer, an unknown page is a 404, no page loads
      # a script file, and the home page carries the measurement ID.
      - name: Check the live site
        run: node scripts/check-live.mjs
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
