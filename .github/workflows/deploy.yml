name: Deploy

# Tests the site and deploys it to Cloudflare Workers.
#
# It runs only when started by hand (Actions, Deploy, Run workflow), so a merge to main
# does not go live. To deploy on every push to main again, add back:
#   push:
#     branches: [main]
#
# wrangler.jsonc says which folder goes live. For now it is ./placeholder.
#
# The workflow needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.156.1'
          command: deploy

      # The page has no script. A script in the live page means Cloudflare added one,
      # for example the Web Analytics beacon, which must not load before consent.
      # A new custom domain can take a minute to answer, so each address gets a few tries.
      - name: Check that the live page loads no script
        run: |
          for host in sudohire.dev www.sudohire.dev; do
            body=""
            for try in 1 2 3 4 5 6; do
              body=$(curl -fsS "https://$host/") && break
              sleep 20
            done
            if [ -z "$body" ]; then
              echo "::error::https://$host/ did not answer."
              exit 1
            fi
            if grep -qiE '<script|cloudflareinsights' <<< "$body"; then
              echo "::error::https://$host/ has a script. Check that Cloudflare Web Analytics is off."
              exit 1
            fi
          done
